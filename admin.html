<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Front Input Panel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Bricolage+Grotesque:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Bricolage Grotesque',sans-serif;

background:
linear-gradient(
135deg,
#080b18 0%,
#111827 50%,
#090d18 100%
);

color:#e6e6e6;

padding:20px;
min-height:100vh;
}

.container{

max-width:1000px;
margin:auto;

background:rgba(10,10,18,.95);

border:2px solid #bfbfbf;
border-radius:24px;

padding:35px;

box-shadow:
0 0 30px rgba(255,255,255,.05),
0 20px 60px rgba(0,0,0,.7);

position:relative;
}

.container::before{
content:"❦";
position:absolute;
top:10px;
left:15px;
color:#d9d9d9;
}

.container::after{
content:"❦";
position:absolute;
bottom:10px;
right:15px;
color:#d9d9d9;
}

h1{
font-family:'UnifrakturMaguntia',cursive;
font-size:48px;
text-align:center;
margin-bottom:30px;
color:white;
}

.section{
margin-bottom:25px;
}

label{
display:block;
margin-bottom:8px;
font-weight:600;
}

select{

width:100%;
padding:12px;

background:#1a1a24;
color:white;

border:1px solid #888;
border-radius:10px;

font-size:16px;
}

.card-preview{

margin-top:20px;

background:#14141d;

border:1px solid #777;

border-radius:16px;

padding:20px;

text-align:center;
}

.card-preview img{

width:220px;
max-width:100%;

border-radius:12px;

border:1px solid #888;
}

.button-row{

display:flex;
gap:12px;
flex-wrap:wrap;
margin-top:20px;
}

button{

padding:12px 22px;

border:none;
border-radius:10px;

cursor:pointer;

font-weight:700;
font-family:'Bricolage Grotesque',sans-serif;
}

.save-btn{
background:#d8d8d8;
color:black;
}

.clear-btn{
background:#555;
color:white;
}

.history{

margin-top:35px;
}

.history-item{

background:#181822;

border:1px solid #555;

border-radius:12px;

padding:12px;

margin-bottom:10px;

display:flex;
justify-content:space-between;
align-items:center;
gap:10px;

flex-wrap:wrap;
}

.history-actions{
display:flex;
gap:8px;
}

.small-btn{

padding:8px 12px;
font-size:13px;
}

.restore{
background:#d7d7d7;
color:black;
}

.delete{
background:#7a2d2d;
color:white;
}

.info{
margin-top:20px;
font-size:14px;
color:#bdbdbd;
}

@media(max-width:768px){

h1{
font-size:30px;
}

.container{
padding:20px;
}

}

</style>
</head>
<body>

<div class="container">

<h1>✦ Front Input ✦</h1>

<div class="section">

<label>Current Fronting</label>

<select id="frontingSelect"></select>

</div>

<div class="card-preview">

<img
id="cardPreview"
src="cards/default.png"
alt="preview">

</div>

<div class="button-row">

<button
class="save-btn"
onclick="saveData()">
Save
</button>

<button
class="clear-btn"
onclick="clearCurrent()">
Clear
</button>

</div>

<div class="info">

当前 display.html 将读取：

<br><br>

nowFronting<br>
nowFrontingId<br>
nowFrontingTime

</div>

<div class="history">

<h2 style="margin-bottom:15px;">
History
</h2>

<div id="historyList"></div>

</div>

</div>

<script>

const MEMBERS = [

{
name:"Lithium",
id:"Lithium"
},

{
name:"B Minten",
id:"BMinten"
},

{
name:"Mahiru",
id:"Mahiru"
},

{
name:"V_eko",
id:"VEko"
},

{
name:"L-Maelonna",
id:"LMaelonna"
},

{
name:"M Anna",
id:"MAnna"
},

{
name:"R-Maria",
id:"RMaria"
},

{
name:"Mors = V",
id:"MorsV"
},

{
name:"Rei = Atlas",
id:"ReiAtlas"
}

];

const select =
document.getElementById("frontingSelect");

MEMBERS.forEach(member=>{

const option =
document.createElement("option");

option.value = member.id;
option.textContent = member.name;

select.appendChild(option);

});

function updatePreview(){

const id = select.value;

const img =
document.getElementById("cardPreview");

img.src = `cards/${id}.png`;

img.onerror = ()=>{

img.onerror = null;
img.src = "cards/default.png";

};

}

select.addEventListener(
"change",
updatePreview
);

updatePreview();

function saveData(){

const id = select.value;

const member =
MEMBERS.find(
m=>m.id===id
);

const data = {

nowFronting:member.name,
nowFrontingId:member.id,

nowFrontingTime:
new Date().toISOString(),

nextFronting:"",
nextFrontingTime:""

};

localStorage.setItem(
"currentFrontingData",
JSON.stringify(data)
);

saveHistory(data);

alert("Saved.");

}

function clearCurrent(){

localStorage.removeItem(
"currentFrontingData"
);

alert("Cleared.");

}

function getHistory(){

return JSON.parse(
localStorage.getItem(
"frontHistory"
) || "[]"
);

}

function saveHistory(entry){

let history =
getHistory();

history.unshift(entry);

history =
history.slice(0,30);

localStorage.setItem(
"frontHistory",
JSON.stringify(history)
);

renderHistory();

}

function restoreHistory(index){

const history =
getHistory();

const entry =
history[index];

localStorage.setItem(
"currentFrontingData",
JSON.stringify(entry)
);

alert("Restored.");

}

function deleteHistory(index){

let history =
getHistory();

history.splice(index,1);

localStorage.setItem(
"frontHistory",
JSON.stringify(history)
);

renderHistory();

}

function renderHistory(){

const list =
document.getElementById(
"historyList"
);

const history =
getHistory();

if(history.length===0){

list.innerHTML =
"<p>No history.</p>";

return;

}

list.innerHTML =
history.map((item,index)=>`

<div class="history-item">

<div>

<b>${item.nowFronting}</b>

<br>

<small>

${new Date(
item.nowFrontingTime
).toLocaleString()}

</small>

</div>

<div class="history-actions">

<button
class="small-btn restore"
onclick="restoreHistory(${index})">
Restore
</button>

<button
class="small-btn delete"
onclick="deleteHistory(${index})">
Delete
</button>

</div>

</div>

`).join("");

}

renderHistory();

</script>

</body>
</html>
