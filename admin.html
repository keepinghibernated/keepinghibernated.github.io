<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - Fronting 管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .form-section {
            background: #f9f9f9;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        select, input[type="datetime-local"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        select:focus, input[type="datetime-local"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .view-btn {
            background: #4CAF50;
            color: white;
            flex: 0.5;
        }

        .view-btn:hover {
            background: #45a049;
        }

        .history-section {
            background: #f9f9f9;
            padding: 25px;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
        }

        .history-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .history-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .history-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            border-left: 3px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .history-item-content {
            flex: 1;
        }

        .history-time {
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }

        .history-detail {
            color: #666;
            font-size: 14px;
            margin: 5px 0;
        }

        .delete-btn {
            background: #f44336;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
        }

        .delete-btn:hover {
            background: #da190b;
        }

        .empty-message {
            color: #999;
            text-align: center;
            padding: 20px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4CAF50;
            color: white;
            padding: 15px 20px;
            border-radius: 5px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .notification.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 Fronting 管理系统 - 后台</h1>

        <div class="form-section">
            <form id="frontingForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nowFronting">现在 Fronting (Now Fronting)</label>
                        <select id="nowFronting" required>
                            <option value="">-- 请选择 --</option>
                            <option value="AA">AA</option>
                            <option value="BB">BB</option>
                            <option value="CC">CC</option>
                            <option value="DD">DD</option>
                            <option value="EE">EE</option>
                            <option value="FF">FF</option>
                            <option value="GG">GG</option>
                            <option value="HH">HH</option>
                            <option value="II">II</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="nextFronting">下一个 Fronting (Next Fronting)</label>
                        <select id="nextFronting" required>
                            <option value="">-- 请选择 --</option>
                            <option value="AA">AA</option>
                            <option value="BB">BB</option>
                            <option value="CC">CC</option>
                            <option value="DD">DD</option>
                            <option value="EE">EE</option>
                            <option value="FF">FF</option>
                            <option value="GG">GG</option>
                            <option value="HH">HH</option>
                            <option value="II">II</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="nowFrontingTime">现在 Fronting 时间 (Now Fronting Time)</label>
                        <input type="datetime-local" id="nowFrontingTime" required>
                    </div>

                    <div class="form-group">
                        <label for="nextFrontingTime">下一个 Fronting 时间 (Next Fronting Time)</label>
                        <input type="datetime-local" id="nextFrontingTime" required>
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" class="submit-btn">📤 提交</button>
                    <button type="button" class="view-btn" onclick="openDisplay()">👁️ 查看展示页面</button>
                </div>
            </form>
        </div>

        <div class="history-section">
            <h2>📋 提交历史</h2>
            <div class="history-list" id="historyList">
                <div class="empty-message">暂无提交记录</div>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        // 初始化表单和历史记录
        function initPage() {
            loadHistory();
            setDefaultDateTime();
        }

        // 设置默认时间为当前时间
        function setDefaultDateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hour = String(now.getHours()).padStart(2, '0');
            const minute = String(now.getMinutes()).padStart(2, '0');

            const defaultDateTime = `${year}-${month}-${day}T${hour}:${minute}`;
            
            document.getElementById('nowFrontingTime').value = defaultDateTime;
            document.getElementById('nextFrontingTime').value = defaultDateTime;
        }

        // 表单提交
        document.getElementById('frontingForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const nowFronting = document.getElementById('nowFronting').value;
            const nextFronting = document.getElementById('nextFronting').value;
            const nowFrontingTime = document.getElementById('nowFrontingTime').value;
            const nextFrontingTime = document.getElementById('nextFrontingTime').value;

            if (!nowFronting || !nextFronting || !nowFrontingTime || !nextFrontingTime) {
                showNotification('请填写所有字段', 'error');
                return;
            }

            // 保存当前数据到 localStorage
            const currentData = {
                nowFronting: nowFronting,
                nextFronting: nextFronting,
                nowFrontingTime: nowFrontingTime,
                nextFrontingTime: nextFrontingTime,
                timestamp: new Date().toLocaleString('zh-CN')
            };

            localStorage.setItem('currentFrontingData', JSON.stringify(currentData));

            // 添加到历史记录
            let history = JSON.parse(localStorage.getItem('frontingHistory') || '[]');
            history.unshift(currentData);
            // 只保存最多 50 条历史记录
            history = history.slice(0, 50);
            localStorage.setItem('frontingHistory', JSON.stringify(history));

            showNotification('✅ 提交成功！数据已保存');
            loadHistory();
        });

        // 加载历史记录
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('frontingHistory') || '[]');
            const historyList = document.getElementById('historyList');

            if (history.length === 0) {
                historyList.innerHTML = '<div class="empty-message">暂无提交记录</div>';
                return;
            }

            historyList.innerHTML = history.map((item, index) => `
                <div class="history-item">
                    <div class="history-item-content">
                        <div class="history-detail">
                            <strong>现在:</strong> ${item.nowFronting} | 
                            <strong>下一个:</strong> ${item.nextFronting}
                        </div>
                        <div class="history-detail">
                            <strong>现在时间:</strong> ${item.nowFrontingTime} | 
                            <strong>下一个时间:</strong> ${item.nextFrontingTime}
                        </div>
                        <div class="history-time">提交时间: ${item.timestamp}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteHistory(${index})">删除</button>
                </div>
            `).join('');
        }

        // 删除历史记录
        function deleteHistory(index) {
            let history = JSON.parse(localStorage.getItem('frontingHistory') || '[]');
            history.splice(index, 1);
            localStorage.setItem('frontingHistory', JSON.stringify(history));
            loadHistory();
            showNotification('✅ 已删除');
        }

        // 显示通知
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // 打开展示页面
        function openDisplay() {
            window.open('display.html', 'display', 'width=1000,height=600');
        }

        // 页面加载时初始化
        window.addEventListener('load', initPage);

        // 每5秒检查一次是否有新数据（用于同步多个后台标签页）
        setInterval(loadHistory, 5000);
    </script>
</body>
</html>
