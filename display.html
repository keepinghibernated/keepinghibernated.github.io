<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>前台状态板</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Bricolage+Grotesque:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Bricolage Grotesque',sans-serif;
    background:
        linear-gradient(
            135deg,
            #0a0e27 0%,
            #14162d 50%,
            #10182d 100%
        );
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:#e0e0e0;
    overflow:hidden;
    position:relative;
}

body::before{
    content:'';
    position:fixed;
    inset:0;

    background:
        radial-gradient(
            circle at 20% 50%,
            rgba(255,255,255,0.03),
            transparent 50%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(180,180,180,0.05),
            transparent 50%
        ),
        radial-gradient(
            circle at 40% 20%,
            rgba(255,255,255,0.02),
            transparent 50%
        );

    animation:drift 20s ease-in-out infinite;
    pointer-events:none;
}

@keyframes drift{
    0%,100%{
        transform:translate(0,0);
    }
    50%{
        transform:translate(20px,-20px);
    }
}

.container{
    width:100%;
    max-width:1000px;

    background:rgba(12,12,20,.92);

    border-radius:24px;

    padding:50px;

    backdrop-filter:blur(15px);

    border:2px solid #b8b8b8;

    box-shadow:
        0 30px 80px rgba(0,0,0,.8),
        inset 0 0 0 1px rgba(255,255,255,.15),
        0 0 30px rgba(255,255,255,.05);

    position:relative;
    z-index:1;
}

    .container::before,
.container::after{
    content:'✦';
    position:absolute;

    color:#cfcfcf;

    font-size:32px;

    text-shadow:
        0 0 8px rgba(255,255,255,.25);

    z-index:2;
}

.container::before{
    top:12px;
    left:18px;
}

.container::after{
    top:12px;
    right:18px;
}

.corner{
    position:absolute;
    color:#bfbfbf;
    font-size:22px;
    opacity:.7;
    pointer-events:none;
}
    
h1{
    text-align:center;

    font-family:'UnifrakturMaguntia',cursive;

    font-size:54px;

    font-weight:normal;

    color:#ffffff;

    margin-bottom:50px;

    letter-spacing:3px;

    text-shadow:
        0 0 10px rgba(255,255,255,.3),
        0 0 20px rgba(255,255,255,.15);
}

.display-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:50px;
    margin-bottom:40px;
}

@media(max-width:900px){
    .display-grid{
        grid-template-columns:1fr;
    }
}

.display-card{
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            180deg,
            rgba(40,40,55,.75),
            rgba(18,18,30,.85)
        );

    border-radius:16px;

    padding:40px;

    text-align:center;

    border:1px solid rgba(210,210,210,.35);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        inset 0 -1px 0 rgba(0,0,0,.35),
        0 10px 30px rgba(0,0,0,.4);

    transition:.4s;
}
.display-card::before{
    content:'❦ ❦ ❦';
    position:absolute;
    top:8px;
    left:50%;
    transform:translateX(-50%);

    color:#d9d9d9;
    font-size:14px;
    letter-spacing:8px;
}

.display-card:hover{
    transform:translateY(-6px);

    box-shadow:
        0 20px 50px rgba(255,255,255,.12);
}

.display-card.next{
    border-color:rgba(120,120,120,.45);
    filter:saturate(.4);
}

.display-card.next::before{
    background:
        linear-gradient(
            90deg,
            transparent,
            #8a8a8a,
            transparent
        );
}

.card-label{
    font-size:14px;

    letter-spacing:2px;

    text-transform:uppercase;

    margin-bottom:20px;

    color:#dddddd;
}

.display-card.next .card-label{
    color:#8f8f8f;
}

.card-main{
    font-size:72px;

    font-weight:800;

    color:#ffffff;

    letter-spacing:4px;

    margin-bottom:25px;

    text-shadow:
        0 0 15px rgba(255,255,255,.18);
}

.display-card.next .card-main{
    color:#9a9a9a;

    text-shadow:
        0 0 10px rgba(150,150,150,.12);
}

.card-time{
    border-top:1px solid rgba(255,255,255,.12);

    padding-top:20px;

    color:#d0d0d0;

    font-size:16px;
}

.display-card.next .card-time{
    border-top-color:rgba(120,120,120,.15);
}

.time-label{
    display:block;

    margin-bottom:8px;

    font-size:12px;

    letter-spacing:1px;

    color:#d0d0d0;
}

.display-card.next .time-label{
    color:#8a8a8a;
}

.refresh-btn{
    display:block;

    margin:0 auto;

    padding:14px 40px;

    border:none;

    border-radius:8px;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #dcdcdc
        );

    color:#111;

    font-family:'Bricolage Grotesque',sans-serif;

    font-weight:700;

    letter-spacing:2px;

    transition:.3s;
}

.refresh-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 10px 25px rgba(255,255,255,.15);
}

.no-data{
    text-align:center;
    padding:60px;
    color:#999;
}

.last-update{
    margin-top:35px;
    text-align:center;
    font-size:13px;
    color:#888;
}

.status-indicator{
    width:8px;
    height:8px;
    display:inline-block;

    border-radius:50%;

    background:#ffffff;

    margin-right:8px;

    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%,100%{
        opacity:1;
    }
    50%{
        opacity:.3;
    }
}

@media(max-width:768px){

    .container{
        padding:30px;
    }

    h1{
        font-size:40px;
    }

    .card-main{
        font-size:48px;
    }
}
</style>
</head>

<body>

<div class="container">
<div class="corner" style="top:15px;left:20px;">❦</div>
<div class="corner" style="top:15px;right:20px;">❦</div>
<div class="corner" style="bottom:15px;left:20px;">❦</div>
<div class="corner" style="bottom:15px;right:20px;">❦</div>
    </div>

    <h1>✦ Front Status ✦</h1>

    <div id="displayContent">
        <div class="no-data">
            <p>◈ 加载中 ◈</p>
        </div>
    </div>

    <button class="refresh-btn" onclick="refreshDisplay()">
        ✦ 刷新 ✦
    </button>

    <div class="last-update">
        <span class="status-indicator"></span>
        <span id="updateTime">
            等待数据中...
        </span>
    </div>

</div>

<script>

function refreshDisplay(){
    loadAndDisplay();
}

function loadAndDisplay(){

    let data = null;

    try{
        data = JSON.parse(
            localStorage.getItem('currentFrontingData')
        );
    }
    catch(error){
        console.error(error);
    }

    if(!data){

        document.getElementById('displayContent').innerHTML=`
            <div class="no-data">
                <p>◈ 暂无数据 ◈</p>
                <p style="margin-top:10px;font-size:14px;">
                    OB的成员没有提交数据
                </p>
            </div>
        `;

        document.getElementById('updateTime').textContent =
            '暂无数据';

        return;
    }

    const formatTime = (value)=>{

        if(!value){
            return '--:--';
        }

        const date = new Date(value);

        if(isNaN(date.getTime())){
            return '--:--';
        }

        return date.toLocaleString(
            'zh-CN',
            {
                month:'2-digit',
                day:'2-digit',
                hour:'2-digit',
                minute:'2-digit',
                second:'2-digit'
            }
        );
    };

    document.getElementById('displayContent').innerHTML = `
        <div class="display-grid">

            <div class="display-card">

                <div class="card-label">
                    ◆ 现在主导 ◆
                </div>

                <div class="card-main">
                    ${data.nowFronting || '--'}
                </div>

                <div class="card-time">
                    <span class="time-label">
                        主导时间
                    </span>

                    ${formatTime(data.nowFrontingTime)}
                </div>

            </div>

            <div class="display-card next">

                <div class="card-label">
                    ◆ 预备主导 ◆
                </div>

                <div class="card-main">
                    ${data.nextFronting || '--'}
                </div>

                <div class="card-time">
                    <span class="time-label">
                        预计时间
                    </span>

                    ${formatTime(data.nextFrontingTime)}
                </div>

            </div>

        </div>
    `;

    document.getElementById('updateTime').textContent =
        '最后更新：' +
        new Date().toLocaleString('zh-CN');
}

window.addEventListener(
    'load',
    loadAndDisplay
);

window.addEventListener(
    'storage',
    loadAndDisplay
);

setInterval(
    loadAndDisplay,
    5000
);

</script>

</body>
</html>
