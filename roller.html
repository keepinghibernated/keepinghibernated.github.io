<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Occult Character Roller</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    background:
        radial-gradient(circle at top, #1a1a1a 0%, #0d0d0d 45%, #050505 100%);
    color:white;
    font-family:'Cinzel', serif;
    padding:40px 20px;
}

.container{
    width:min(900px, 100%);
}

.title-image{
    width:min(400px, 100%);
    margin:0 auto 40px;
    display:block;
    border-radius:18px;
    box-shadow:
        0 0 30px rgba(180, 180, 180, 0.3);
}

.choices{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:18px;
}

.choice{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:22px;
    border-radius:18px;
    background:rgba(15, 15, 15, 0.9);
    border:1px solid rgba(200, 200, 200, 0.25);
    cursor:pointer;
    transition:0.25s;
    font-size:1.15rem;
    overflow:hidden;
}

.choice:hover{
    border-color:#e0e0e0;
    box-shadow:
        0 0 18px rgba(200, 200, 200, 0.25);
}

.choice.selected{
    border-color:#f5f5f5;
    background:rgba(35, 35, 35, 0.95);
    box-shadow:
        0 0 20px rgba(220, 220, 220, 0.35);
}

.choice input{
    display:none;
}

.checkbox{
    width:34px;
    height:34px;
    border-radius:8px;
    border:2px solid rgba(255,255,255,0.4);
    transition:0.25s;
    flex-shrink:0;
}

.choice.selected .checkbox{
    background:#d0d0d0;
    border-color:#f5f5f5;
    box-shadow:
        0 0 12px rgba(220, 220, 220, 0.8);
}

.roll-btn{
    width:100%;
    margin-top:26px;
    padding:24px;
    border:none;
    border-radius:22px;
    background:
        linear-gradient(135deg, #2a2a2a, #1a1a1a);
    color:white;
    font-family:'Cinzel', serif;
    font-size:2rem;
    cursor:pointer;
    transition:0.25s;
    border:1px solid rgba(180, 180, 180, 0.45);
    box-shadow:
        0 0 25px rgba(150, 150, 150, 0.25);
}

.roll-btn:hover{
    transform:scale(1.01);
    box-shadow:
        0 0 30px rgba(180, 180, 180, 0.45);
}

.result{
    margin-top:32px;
    padding:28px;
    border-radius:28px;
    background:rgba(12, 12, 12, 0.95);
    border:1px solid rgba(200, 200, 200, 0.3);
    display:none;
    text-align:center;
    box-shadow:
        0 0 40px rgba(150, 150, 150, 0.3);
}

.result-name{
    font-size:4rem;
    color:#f0f0f0;
    margin-bottom:20px;
    text-shadow:
        0 0 18px rgba(200, 200, 200, 0.6);
}

.result img{
    width:min(700px, 100%);
    border-radius:18px;
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:
        0 0 28px rgba(180, 180, 180, 0.35);
}

.bounce{
    animation:bounce 0.8s ease;
}

@keyframes bounce{

    0%{
        opacity:0;
        transform:translateY(-80px) scale(0.7);
    }

    40%{
        opacity:1;
        transform:translateY(0px) scale(1.06);
    }

    60%{
        transform:translateY(-16px) scale(0.97);
    }

    80%{
        transform:translateY(0px) scale(1.02);
    }

    100%{
        transform:translateY(0px) scale(1);
    }
}

@media(max-width:700px){

    .choices{
        grid-template-columns:1fr;
    }

    .result-name{
        font-size:2.6rem;
    }

    .roll-btn{
        font-size:1.5rem;
    }

    .title-image{
        width:min(300px, 100%);
        margin-bottom:30px;
    }
}

</style>
</head>
<body>

<div class="container">

    <img src="HBIcon-white.PNG" alt="Keeping Hibernated" class="title-image">

    <div class="choices" id="choices"></div>

    <button class="roll-btn" onclick="rollCharacter()">
        Roll
    </button>

    <div class="result" id="result">

        <div class="result-name" id="resultName"></div>

        <img id="resultImage" src="" alt="">

    </div>

</div>

<script>

const characters = [

    {
        name: "Golem",
        image: "1EA312E33A0DC9A7C69B9B27CBB67AD1.png"
    },

    {
        name: "Dryad",
        image: "769296CD2A3EFC351F3A183168948A07.png"
    },

    {
        name: "Oceanid",
        image: "BBDC0F505C43BDB599AC686524D65C83.png"
    },

    {
        name: "Narehate",
        image: "E8B73DC9ABCCC3C5355F2C1C73039D04.png"
    },

    {
        name: "Bakeneko",
        image: "E602E0F72BF016BA3C5F9BD3F3B52213.png"
    },

    {
        name: "Witch",
        image: "DE192AB3CFF6402597D9B58279EED089.png"
    },

    {
        name: "Detective",
        image: "B792D0100DB3B3621FDB3AB59E196149.png"
    },

    {
        name: "Vampire",
        image: "F4074E948F1E8657041171CC9DA14EC5.png"
    },

    {
        name: "Fae",
        image: "E9BD3ACF86F330135A333D05BFFBB30D.png"
    }
];

const choices = document.getElementById("choices");

characters.forEach((char, index) => {

    const label = document.createElement("label");

    label.className = "choice";

    label.innerHTML = `
        <input type="checkbox" value="${index}">
        <div class="checkbox"></div>
        <div>${char.name}</div>
    `;

    const checkbox = label.querySelector("input");

    checkbox.addEventListener("change", () => {

        label.classList.toggle("selected", checkbox.checked);

    });

    choices.appendChild(label);

});

function rollCharacter(){

    const selected =
        [...document.querySelectorAll("input:checked")];

    if(selected.length === 0){

        alert("Select at least one character.");

        return;
    }

    const picked =
        selected[Math.floor(Math.random() * selected.length)];

    const character =
        characters[picked.value];

    const result =
        document.getElementById("result");

    const resultName =
        document.getElementById("resultName");

    const resultImage =
        document.getElementById("resultImage");

    resultName.textContent =
        character.name;

    resultImage.src =
        character.image;

    resultImage.alt =
        character.name;

    result.style.display = "block";

    result.classList.remove("bounce");

    void result.offsetWidth;

    result.classList.add("bounce");

    result.scrollIntoView({
        behavior:"smooth"
    });
}

</script>

</body>
</html>
